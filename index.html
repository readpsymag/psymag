<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FFFFFF;color:#0A0A0A;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0A0A0A;text-decoration:none}
a:hover{color:#FF5757}
input,textarea,button{font-family:inherit}
::selection{background:#FF5757;color:#FFFFFF}
@keyframes psyfade{from{opacity:0}to{opacity:1}}
@keyframes psyrise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes psybob{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes psymarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes psyletter{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes psyletter2{from{transform:translateY(105%)}to{transform:translateY(0)}}

@media (max-width:760px){
  [data-hero]{padding:64px 20px 18px !important}
  [data-hero] h1 span span span span{font-size:clamp(40px,13.6vw,80px) !important;letter-spacing:-.03em !important;text-rendering:optimizeLegibility !important}
  [data-hero] h1 span span span span[style*="stroke:2px"]{-webkit-text-stroke-width:.35px !important}
  [data-filmwrap]{height:min(46vh,330px) !important;margin-top:14px !important}
  [data-archhead]{padding:0 20px 34px !important;gap:12px !important}
  [data-archhead] h2{font-size:clamp(32px,10vw,54px) !important}
  [data-archhead] span{font-size:16px !important}
  [data-chit]{width:78vw !important;min-height:0 !important}
  [data-chit] > div:last-child{padding:22px 20px 26px !important}
  [data-chit] span{font-size:16px !important}
  [data-socialrow]{gap:14px !important;padding:28px 20px 0 !important}
  [data-socialrow] a{width:50px !important;height:50px !important}
  [data-heartout]{padding:32px 16px 4px !important;gap:12px !important}
  [data-heartout] span{font-size:15px !important;letter-spacing:.06em !important}
  [data-helprow]{padding:60px 16px 0 !important}
  [data-helprow] a{padding:10px 16px 10px 10px !important;gap:12px !important}
  [data-helprow] a > span:first-child{width:40px !important;height:40px !important}
  [data-helprow] a span:last-child{font-size:13px !important;letter-spacing:.06em !important}
  #lost-letters{padding:24px 0 80px !important}
  #psydot{display:none !important}
}
</style>
</helmet>

<div style="background:#FFFFFF;font-family:Outfit,sans-serif;overflow-x:hidden;position:relative">









<section data-hero="" style="padding:100px 40px 30px;display:flex;flex-direction:column;justify-content:flex-start;max-width:1600px;margin:0 auto">
  <h1 style="margin:0;display:flex;flex-direction:column;align-items:center;gap:0">
    <sc-for list="{{ headlineLines }}" as="line" hint-placeholder-count="2">
      <span style="display:flex;flex-wrap:nowrap;padding-bottom:.12em;width:fit-content;max-width:100%;color:#0A0A0A;cursor:default">
        <sc-for list="{{ line.letters }}" as="l" hint-placeholder-count="10">
          <span style="display:inline-block;overflow:hidden;padding-top:.14em;margin-top:-.14em;padding-left:.12em;margin-left:-.12em;padding-right:.14em;margin-right:-.14em">
            <span style="display:inline-block;transform:translateY(105%);animation:{{ animName }} .9s cubic-bezier(.22,1,.36,1) {{ l.delay }} both">
              <span data-hue="{{ l.hoverColor }}" data-base="{{ l.base }}" onMouseEnter="{{ letterOn }}" onMouseLeave="{{ letterOff }}" style="display:inline-block;font:600 clamp(46px,10.4vw,164px)/.94 Outfit,sans-serif;letter-spacing:-.045em;color:{{ l.base }};-webkit-text-stroke:{{ l.stroke }};transition:transform .3s cubic-bezier(.22,1,.36,1),color .16s" style-hover="transform:translateY(-12%)">{{ l.ch }}</span>
            </span>
          </span>
        </sc-for>
      </span>
    </sc-for>
  </h1>

  <div data-filmwrap="" style="position:relative;margin-top:6px;height:clamp(320px,46vh,540px);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%)">
    <canvas id="psyfilm" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
  </div>

</section>

<section id="lost-letters" style="padding:40px 0 120px">
  <div id="psydot" style="position: fixed; top: -8px; left: -10px; width: 14px; height: 14px; border-radius: 50%; background: #0A0A0A; z-index: 200; pointer-events: none; opacity: 0; transition: opacity .3s; will-change: transform; transform: translate(-20px,-20px)"></div>
  <div data-archhead="" style="max-width:1600px;margin:0 auto;padding:0 40px 52px;display:flex;flex-direction:column;gap:16px">
    <h2 style="margin:0;font:600 clamp(34px,5.4vw,86px)/.94 Outfit,sans-serif;letter-spacing:-.045em;color:#0A0A0A">human archive</h2>
    <span style="font:300 clamp(17px,1.35vw,21px)/1.6 Outfit,sans-serif;color:#2A2A2A;max-width:52ch;text-wrap:pretty">notes people wrote and never sent, kept exactly as they arrived.</span>
  </div>
  <div style="overflow:hidden;padding:26px 0">
    <div style="display:flex;width:max-content;gap:26px;animation:psymarquee 62s linear infinite">
      <sc-for list="{{ chitsLoop }}" as="c" hint-placeholder-count="8">
        <div data-chit="" style="width:372px;flex:none;background:#FFFFFF;border:1.5px solid #0A0A0A;min-height:250px;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease" style-hover="transform:translateY(-10px);box-shadow:10px 10px 0 0 #0A0A0A">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0A0A0A;padding:11px 18px">
            <span style="font:600 12px/1 Outfit,sans-serif;letter-spacing:.16em;color:#FFFFFF">anonymous</span>
            <span style="display:block;width:9px;height:9px;background:{{ c.hue }}"></span>
          </div>
          <div style="flex:1;display:flex;align-items:flex-start;padding:30px 26px 34px">
            <span style="font:300 clamp(17px,1.35vw,21px)/1.5 Outfit,sans-serif;color:#0A0A0A;text-wrap:pretty">{{ c.text }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div data-filmwrap="" style="position:relative;margin-top:96px;height:clamp(340px,52vh,560px);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)">
    <canvas id="psyarchive" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
  </div>

  <div data-heartout="" style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:44px 20px 8px;text-align:center">
    <span style="font:600 clamp(15px,1.6vw,19px)/1.5 Outfit,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#0A0A0A;text-wrap:pretty">tell what you never told anyone, <span style="color:#38B6FF">anonymously</span></span>
    <svg width="22" height="46" viewBox="0 0 22 46" style="animation:psybob 2.6s ease-in-out infinite">
      <path d="M11 2 L11 34 M3 26 L11 34 L19 26" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>

      [10.15, 11.60, "UNTIL THE GLASS GIVES", 0],
      [12.60, 15.05, "EVERY ONE OF THESE IS SOMEONE", 0],
      [16.60, 19.05, "LET YOURS OUT. ANONYMOUSLY.", 1]
    ];

    const draw = now => {
      const T = Math.floor(((now % LOOP) / 1000) * FPS) / FPS;
      const gt = Math.floor(now / 45);
      ctx.clearRect(0, 0, w, h);

      const SV = Math.min(w / SW, h / SHT) * .56;
      const BV = Math.min(w / (BW * 2.35), h / (BH * 1.22));
      const FAR = BV * .30;

      // ---- act state -----------------------------------------------------
      const bottleA = seg(T, 4.7, 5.5) * (1 - seg(T, 16.35, 17.0));
      const holdBreath = seg(T, 9.35, 9.5) * (1 - seg(T, 9.85, 10.0));
      const strain = eo(seg(T, 6.9, 9.6)) * (1 - seg(T, 11.4, 12.0)) * (1 - .9 * holdBreath);
      const corkQ = eio(seg(T, 8.9, 9.35));
      const fillN = Math.min(SLOTS.length, Math.floor(seg(T, 5.55, 9.5) * SLOTS.length) + 1);
      const fieldA = eo(seg(T, 11.9, 12.9)) * (1 - seg(T, 15.5, 16.2));
      const relQ = seg(T, 16.3, 17.5);
      const relY = lerp(-BH / 2 - 50, -BH / 2 - 320, eo(relQ));
      const unfold = 1 - eio(seg(T, 17.25, 18.05));
      const lift = seg(T, 17.9, 18.85);

      const heroFold = eio(seg(T, 3.35, 4.35));
      const heroInk = 1 - .78 * seg(T, 3.5, 4.25);
      const heroReveal = Math.min(1,
        seg(T, .35, .95) * .22 + seg(T, 1.15, 1.62) * .2 + seg(T, 1.98, 2.42) * .22 + seg(T, 2.66, 3.05) * .4);
      const heroBeats = {
        strike: seg(T, 1.66, 1.9) * (1 - seg(T, 3.5, 4.0)),
        blot: seg(T, 2.10, 2.62) * (1 - seg(T, 3.55, 4.2)),
        pen: seg(T, .12, .26) * (1 - seg(T, 3.06, 3.2)),
        caret: seg(T, .02, .1) * (1 - seg(T, .3, .4)) + seg(T, 18.9, 19.1)
      };

      // breath: slow, then shallow and fast under strain, slow again after release
      const bp = 1 + .0055 * Math.sin(T * 1.45) + .0075 * strain * Math.sin(T * 7.1) + .01 * eo(relQ) * Math.sin(T * 1.1);

      let sc, camX, camY;
      if (T < 4.35) { sc = SV; camX = 0; camY = SKY; }
      else if (T < 5.6) {
        const q = eio(seg(T, 4.35, 5.6));
        sc = lerp(SV, BV, q); camX = 0; camY = lerp(SKY, 0, q);
      } else if (T < 11.7) {
        const q = seg(T, 5.6, 11.7);
        sc = BV * lerp(1, .94, q); camX = 0; camY = lerp(0, -46, q);
      } else if (T < 15.3) {
        const q = eio(seg(T, 11.7, 13.0));
        sc = lerp(BV * .94, FAR, q);
        camX = lerp(0, CX * 1.7, seg(T, 13.0, 15.3));
        camY = lerp(-46, 0, q);
      } else {
        const q = eio(seg(T, 15.3, 16.8));
        sc = lerp(FAR, SV * .9, q);
        camX = lerp(CX * 1.7, 0, q);
        camY = lerp(0, -BH / 2 - 320, q);
      }
      sc *= bp;

      let hit = 0;
      for (let c = 0; c < CRACKS.length; c++) hit += T >= CRACKS[c].t ? Math.pow(1 - seg(T, CRACKS[c].t, CRACKS[c].t + .3), 2) : 0;
      const thud = Math.pow(1 - seg(T, 9.35, 9.62), 2.4);
      ctx.save();
      ctx.translate((rnd(gt) - .5) * 1.6 + (rnd(gt * 1.7) - .5) * (hit * 6 + thud * 4), (rnd(gt + 7) - .5) * 1.2 + (rnd(gt * 2.3 + 9) - .5) * (hit * 4.5 + thud * 3));
      ctx.translate(w / 2, h / 2);
      ctx.scale(sc, sc);
      ctx.translate(-camX, -camY);
      ctx.lineWidth = 1.5 / sc;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // ---- the field: everyone else, holding it in -----------------------
      if (fieldA > .01) {
        const halfW = (w / 2) / sc + CX, halfH = (h / 2) / sc + CY;
        for (let i = 0; i < COLS; i++) {
          for (let j = 0; j < ROWS; j++) {
            if (i === HC && j === HR) continue;
            const px = cellX(i), py = cellY(j);
            if (Math.abs(px - camX) > halfW || Math.abs(py - camY) > halfH) continue;
            const seed = i * 13.7 + j * 4.3 + 1;
            const d = Math.min(1, Math.hypot(i - HC, j - HR) / 8.5);
            const open = i === OC && j === OR;
            let a = fieldA * (.3 + .7 * eo(seg(T, 11.9 + d * .55, 12.6 + d * .55)));
            if (open) a = Math.max(a, fieldA);
            if (a <= .02) continue;
            a *= lerp(1, .5, d);
            const lvl = .58 + rnd(seed * 2.7) * .4;
            ctx.save();
            ctx.translate(px, py + (rnd(seed * 1.9) - .5) * 34);
            const br = .5 + .5 * Math.sin(T * (1.6 + rnd(seed) * 1.8) + seed * 2.1);
            ctx.translate((rnd(seed + gt * .5) - .5) * 4 * br, 0);
            const vs = (.9 + rnd(seed * 3.3) * .18) * (1 + .006 * Math.sin(T * (1.5 + rnd(seed) * 1.4) + seed));
            ctx.scale(vs, vs);
            ctx.lineWidth = (1.5 / sc) / vs;
            bottlePath();
            ctx.strokeStyle = ink(.8 * a);
            ctx.stroke();
            if (!open) {
              ctx.strokeStyle = ink(.7 * a);
              ctx.strokeRect(-NW / 2 - 9, -BH / 2 - 16, NW + 18, 18);
            }
            const bot = BH / 2 - 20, top0 = -BH / 2 + NH + 118;
            const ly = lerp(bot, top0 - 90, open ? .1 : lvl);
            for (let k = 0; k < 4; k++) {
              const yy = bot - 40 - k * 96;
              if (yy < ly) break;
              for (let c2 = 0; c2 < 2; c2++) {
                ctx.save();
                ctx.translate((c2 - .5) * 104, yy);
                ctx.rotate((rnd(seed + k * 3 + c2) - .5) * 1.1);
                ctx.strokeStyle = ink(.5 * a);
                ctx.strokeRect(-SW * .23, -SHT * .23, SW * .46, SHT * .46);
                ctx.restore();
              }
            }
            if (open) {
              for (let k = 0; k < RISE.length; k++) {
                const q = seg(T, RISE[k].t, RISE[k].t + 2.1);
                if (q <= 0 || q >= 1) continue;
                const y = -BH / 2 - 40 - eo(q) * BH * 1.15 * RISE[k].sp;
                const x = Math.sin(q * 3.4 + k) * BW * .3 * q;
                sheet({
                  x: x, y: y, seed: k * 8.3 + 91, a: a * (1 - q * .55), reveal: 1,
                  inkA: .5, fold: 1 - eo(q) * .75, t: T, rot: RISE[k].rot * q, hue: blue
                });
              }
            }
            ctx.restore();
          }
        }
      }

      // ---- the glass, in front of what it holds --------------------------
      const glass = () => {
        if (bottleA <= .01) return;
        ctx.save();
        ctx.translate((rnd(gt * 1.3) - .5) * 7 * strain, (rnd(gt * 1.9 + 4) - .5) * 4 * strain);
        const sh0 = -BH / 2 + NH;
        ctx.beginPath();
        ctx.ellipse(0, BH / 2 + 16, BW * .52, 16, 0, 0, TAU);
        ctx.fillStyle = ink(.07 * bottleA);
        ctx.fill();
        bottlePath();
        ctx.strokeStyle = ink(.88 * bottleA);
        ctx.stroke();
        ctx.strokeStyle = ink(.2 * bottleA);
        ctx.beginPath();
        ctx.moveTo(-BW / 2 + 24, sh0 + 152);
        ctx.lineTo(-BW / 2 + 24, BH / 2 - 64);
        ctx.moveTo(BW / 2 - 18, sh0 + 190);
        ctx.lineTo(BW / 2 - 18, BH / 2 - 130);
        ctx.stroke();
        // the cork: pressed down, sealing it
        if (corkQ > .01) {
          const cy = lerp(-BH / 2 - 120, -BH / 2 - 7, corkQ);
          ctx.strokeStyle = ink(.85 * bottleA);
          ctx.strokeRect(-NW / 2 - 9, cy - 9, NW + 18, 20);
          ctx.strokeStyle = ink(.3 * bottleA);
          ctx.beginPath();
          ctx.moveTo(-NW / 2 - 2, cy + 1); ctx.lineTo(NW / 2 + 2, cy + 1);
          ctx.stroke();
        }
        if (strain > .02) {
          for (let k = 0; k < 3; k++) {
            const puls = Math.max(0, Math.sin(T * (2.3 + k * .5) + k * 2.1));
            if (puls < .5) continue;
            const yy = sh0 + 70 + k * 150, side = k % 2 ? 1 : -1;
            ctx.strokeStyle = ink(.38 * strain * bottleA * (puls - .5) / .5);
            ctx.beginPath();
            ctx.moveTo(side * (BW / 2 + 4), yy - 22);
            ctx.lineTo(side * (BW / 2 + 26), yy);
            ctx.lineTo(side * (BW / 2 + 6), yy + 24);
            ctx.stroke();
          }
        }
        for (let c = 0; c < CRACKS.length; c++) {
          const ck = CRACKS[c], cq = seg(T, ck.t, ck.t + .42);
          if (cq <= 0) continue;
          ctx.strokeStyle = ink(.78 * bottleA);
          ctx.lineWidth = (1.5 / sc) * 1.3;
          const n = ck.pts.length - 1, upto = cq * n;
          ctx.beginPath();
          ctx.moveTo(ck.pts[0][0], ck.pts[0][1]);
          for (let k = 1; k <= n; k++) {
            if (upto < k) {
              const f = Math.max(0, upto - (k - 1));
              ctx.lineTo(lerp(ck.pts[k - 1][0], ck.pts[k][0], f), lerp(ck.pts[k - 1][1], ck.pts[k][1], f));
              break;
            }
            ctx.lineTo(ck.pts[k][0], ck.pts[k][1]);
          }
          ctx.stroke();
          if (cq > .55) {
            const bq = seg(cq, .55, 1), bn = ck.br.length - 1, bupto = bq * bn;
            ctx.beginPath();
            ctx.moveTo(ck.br[0][0], ck.br[0][1]);
            for (let k = 1; k <= bn; k++) {
              if (bupto < k) {
                const f = Math.max(0, bupto - (k - 1));
                ctx.lineTo(lerp(ck.br[k - 1][0], ck.br[k][0], f), lerp(ck.br[k - 1][1], ck.br[k][1], f));
                break;
              }
              ctx.lineTo(ck.br[k][0], ck.br[k][1]);
            }
            ctx.stroke();
          }
          ctx.lineWidth = 1.5 / sc;
        }
        for (let i = 0; i < SHARDS.length; i++) {
          const sd = SHARDS[i], q = seg(T, sd.t, sd.t + .8);
          if (q <= 0 || q >= 1) continue;
          const o = CRACKS[sd.c].from;
          const d = eo(q) * 150 * sd.sp;
          const px2 = o[0] + Math.cos(sd.ang) * d * CRACKS[sd.c].side, py2 = o[1] + Math.sin(sd.ang) * d + ei(q) * 190;
          const rr = sd.rot * q, L = sd.len * .5;
          ctx.strokeStyle = ink(.8 * (1 - q) * bottleA);
          ctx.beginPath();
          ctx.moveTo(px2 - Math.cos(rr) * L, py2 - Math.sin(rr) * L);
          ctx.lineTo(px2 + Math.cos(rr) * L, py2 + Math.sin(rr) * L);
          ctx.stroke();
        }
        ctx.restore();
      };

      const drop = (i, sl) => {
        const q = seg(T, sl.t, sl.t + .52);
        if (q <= 0) return null;
        return { x: sl.x * Math.min(1, q * 1.6), y: lerp(-BH / 2 - 320, sl.y, ei(q)), rot: sl.rot * eo(q) };
      };

      // the others already folded away
      if (bottleA > .01) {
        for (let i = 1; i < fillN; i++) {
          const p = drop(i, SLOTS[i]);
          if (!p) continue;
          sheet({
            x: p.x, y: p.y, seed: i * 9.1 + 5, a: bottleA, reveal: 1, inkA: .32 * bottleA,
            fold: 1, press: strain * (.5 + .5 * rnd(i * 2.3)), t: T, rot: p.rot
          });
        }
      }

      // ---- the one being written, and the drafts that never made it ------
      if (T < 4.6) {
        crumple(-SW * 1.02, SKY + SHT * .34, 3.7, seg(T, 1.25, 1.5) * (1 - seg(T, 4.3, 4.6)), SW * .17);
        crumple(SW * 1.06, SKY + SHT * .42, 8.1, seg(T, 2.5, 2.75) * (1 - seg(T, 4.3, 4.6)), SW * .15);
      }
      const heroDrop = drop(0, SLOTS[0]);
      const relOn = relQ > 0;
      if (relOn) {
        sheet({
          x: 0, y: relY, seed: 1, a: 1, reveal: 1, inkA: .42 * (1 - seg(T, 18.0, 18.75)),
          fold: unfold, press: (1 - eo(relQ)) * .5, t: T,
          rot: (1 - eo(relQ)) * .3, hue: blue,
          beats: { strike: 0, blot: 0, pen: 0, caret: heroBeats.caret }
        });
        if (lift > 0) {
          for (let i = 0; i < PART.length; i++) {
            const p = PART[i], q = cl((lift - rnd(i * 7.7) * .24) / .76);
            if (q <= 0) continue;
            ctx.beginPath();
            ctx.arc((p.x + p.dx * q * 1.4) * SW, relY + p.y * SHT - eo(q) * SHT * p.sp * .95, 1.9 / sc, 0, TAU);
            ctx.fillStyle = blue(.55 * (1 - q));
            ctx.fill();
          }
        }
      } else if (T < 5.9 || bottleA > .01) {
        sheet({
          x: heroDrop ? heroDrop.x : 0, y: heroDrop ? heroDrop.y : SKY, seed: 1,
          a: T < 5.9 ? 1 : bottleA, reveal: heroReveal, inkA: heroInk, fold: heroFold,
          press: heroDrop && T > 6.1 ? strain * .85 : 0, t: T,
          rot: heroDrop ? heroDrop.rot : 0, beats: heroBeats
        });
      }

      glass();

      // what leaves through the cracks
      if (bottleA > .01) {
        for (let i = 0; i < 22; i++) {
          const ci = i % 3, ck = CRACKS[ci];
          const q = seg(T, ck.t + .1 + rnd(i * 3.7) * .5, ck.t + 1.5 + rnd(i * 2.1) * .8);
          if (q <= 0 || q >= 1) continue;
          const s1 = rnd(i * 5.3 + 1), s2 = rnd(i * 1.7 + 6);
          const X = ck.from[0] + ck.side * eo(q) * (110 + s1 * 210);
          const Y = ck.from[1] + Math.sin(q * 3.1 + s2 * 6) * 60 - eo(q) * 190 * (.4 + s2 * .8);
          const L = 8 + s1 * 15, ang = s2 * 6.28 + q * 2.4;
          ctx.strokeStyle = ink(.6 * (1 - q) * bottleA);
          ctx.beginPath();
          ctx.moveTo(X - Math.cos(ang) * L, Y - Math.sin(ang) * L);
          ctx.lineTo(X + Math.cos(ang) * L, Y + Math.sin(ang) * L);
          ctx.stroke();
        }
        for (let i = 0; i < ESC.length; i++) {
          const e = ESC[i], q = seg(T, e.t, e.t + 1.5);
          if (q <= 0 || q >= 1) continue;
          const o = CRACKS[e.c].from;
          sheet({
            x: o[0] + CRACKS[e.c].side * eo(q) * BW * .95 * e.sp,
            y: o[1] + ei(q) * BH * .85, seed: i * 6.3 + 51,
            a: bottleA * (1 - q * .45), reveal: 1, inkA: .28, fold: 1, t: T, rot: e.rot * q
          });
        }
      }
      ctx.restore();

      // ---- the frame closes while it is held, opens when it is let out ---
      const squeeze = Math.min(1, seg(T, 1.4, 3.5) * .5 + strain * .5) * (1 - seg(T, 16.2, 17.6));
      const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * (.22 - .15 * squeeze), w / 2, h / 2, Math.max(w, h) * (.74 - .32 * squeeze));
      vg.addColorStop(0, "rgba(255,255,255,0)");
      vg.addColorStop(1, "rgba(255,255,255,.93)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, w, h);

      for (let c = 0; c < CAPS.length; c++) {
        const a0 = CAPS[c][0], a1 = CAPS[c][1], txt = CAPS[c][2], acc = CAPS[c][3];
        if (T < a0 || T > a1) continue;
        const ca = Math.min(seg(T, a0, a0 + .24), 1 - seg(T, a1 - .3, a1));
        let fs = Math.max(11, Math.min(w, h) * .0295), tw = 0, ls = 0;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        for (let k = 0; k < 9; k++) {
          ctx.font = "600 " + fs + "px Outfit, sans-serif";
          ls = fs * .16; tw = 0;
          for (let i = 0; i < txt.length; i++) tw += ctx.measureText(txt[i]).width + ls;
          tw -= ls;
          if (tw + fs * 3.4 <= w * .9 || fs <= 11) break;
          fs *= .91;
        }
        const bw = tw + fs * 3.4, bh = fs * 2.9;
        const cy = h * .875 + (1 - eo(seg(T, a0, a0 + .32))) * fs * .9;
        ctx.globalAlpha = ca;
        ctx.fillStyle = "#0A0A0A";
        ctx.fillRect(w / 2 - bw / 2, cy - bh / 2, bw, bh);
        if (acc) {
          ctx.fillStyle = "#FF5757";
          ctx.fillRect(w / 2 - bw / 2, cy - bh / 2, fs * .38, bh);
        }
        ctx.fillStyle = "#FFFFFF";
        let tx = w / 2 - tw / 2;
        for (let i = 0; i < txt.length; i++) {
          ctx.fillText(txt[i], tx, cy + 1);
          tx += ctx.measureText(txt[i]).width + ls;
        }
        ctx.globalAlpha = 1;
      }

      for (let i = 0; i < 190; i++) {
        const r1 = rnd(gt * 3.1 + i), r2 = rnd(gt * 1.7 + i * 2.3);
        ctx.fillStyle = "rgba(10,10,10," + (.02 + r1 * .045).toFixed(3) + ")";
        ctx.fillRect(r1 * w, r2 * h, 1.4, 1.4);
      }
    };
    draw(performance.now());
    this._atimer = setInterval(() => draw(performance.now()), 40);
  }

    if (this._io) this._io.disconnect();
  }
